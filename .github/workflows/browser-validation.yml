name: Scientific and browser qualification
on:
  push:
    branches: [main, validation/experimental-20261009]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node tools/build.mjs && git diff --exit-code -- dist/sites-and-states.html
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python tools/oracle.py --check tests/fixtures/oracle.json
      - run: npm ci --ignore-scripts --prefix browser-validation
      - run: browser-validation/node_modules/.bin/playwright install --with-deps chromium
      - run: browser-validation/node_modules/.bin/playwright test -c browser-validation/playwright.config.mjs
      - name: Record exact qualification input
        if: always()
        run: |
          mkdir -p browser-results
          printf '{"commit":"%s","node":"%s"}\n' "$GITHUB_SHA" "$(node --version)" > browser-results/input.json
          sha256sum dist/sites-and-states.html > browser-results/build.sha256
      - name: Save exact-commit browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sites-and-states-validation-${{ github.sha }}
          path: |
            browser-report/
            browser-results/
          retention-days: 14
          if-no-files-found: warn
